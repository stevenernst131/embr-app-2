version: 1
platform: python
platformVersion: "3.12"
autoDeploy: true

run:
  port: 8000
  startCommand: bash /output/start.sh

dependencies:
  app-database:
    type: postgres
    description: "Main application database for notes"
    required: true
    provides:
      - name: DATABASE_URL
        secret: true
        scope: runtime
  my-secret-thing:
    type: external
    description: "test generic dep"
    required: true
    provides:
      - name: MY_SECRET_THING
        secret: true
        scope: runtime
  multi-renamed-provider:
    type: external
    description: "F-renamed from multi-provider"
    required: false
    provides:
      - name: MULTI_RUNTIME_SECRET
        secret: true
        scope: runtime
      - name: MULTI_RUNTIME_PUBLIC
        secret: false
        scope: runtime
      - name: MULTI_BUILD_SECRET
        secret: true
        scope: build
      - name: MULTI_BUILD_PUBLIC
        secret: false
        scope: build
  third-dep:
    type: external
    description: "F: renamed dep target"
    required: false
    provides:
      - name: THIRD_DEP_VAL
        secret: false
        scope: runtime
  dup-provides:
    type: external
    description: "J: two provides with same name"
    required: false
    provides:
      - name: DUP_NAME
        secret: false
        scope: runtime
      - name: DUP_NAME
        secret: true
        scope: runtime
  no-provides-dep:
    type: external
    description: "J: no provides block"
    required: false
  weird.name-with..dots__and-DASHES-99:
    type: external
    description: "J: weird name"
    required: false
    provides:
      - name: WEIRD_NAME_VAR
        secret: false
        scope: runtime
  this-is-a-very-long-dependency-name-that-keeps-going-and-going-and-going-and-going-and-going-and-going-and-going-and-going:
    type: external
    description: "J: long name"
    required: false
    provides:
      - name: LONG_NAME_VAR
        secret: false
        scope: runtime

cache:
  enabled: true

blobs:
  enabled: true

healthCheck:
  path: /health
