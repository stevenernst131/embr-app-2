version: 1
platform: python
platformVersion: "3.12"
autoDeploy: true

run:
  port: 8000
  startCommand: bash /output/start.sh

dependencies:
  app-database:
    type: postgres
    description: "Main application database for notes"
    required: true
    provides:
      - name: DATABASE_URL
        secret: true
        scope: runtime
  my-secret-thing:
    type: external
    description: "test generic dep"
    required: true
    provides:
      - name: MY_SECRET_THING
        secret: true
        scope: runtime

cache:
  enabled: true

blobs:
  enabled: true

healthCheck:
  path: /health
