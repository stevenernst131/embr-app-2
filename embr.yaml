version: 1
platform: python
platformVersion: "3.12"
autoDeploy: true

run:
  port: 8000
  startCommand: bash /output/start.sh

dependencies:
  app-database:
    type: postgres
    description: "Main application database for notes"
    required: true
    provides:
      - name: DATABASE_URL
        secret: true
        scope: runtime
  feature-flag-service:
    type: external
    description: "Test generic dep added in ephemeral env"
    required: false
    provides:
      - name: FEATURE_FLAG_API_KEY
        secret: true
        scope: runtime
      - name: FEATURE_FLAG_BASE_URL
        secret: false
        scope: runtime

cache:
  enabled: true

blobs:
  enabled: true

healthCheck:
  path: /health
