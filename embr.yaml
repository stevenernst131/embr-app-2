platform: python
platformVersion: "3.12"
autoDeploy: true

run:
  port: 8000
  startCommand: bash -c "source /output/pythonenv3.12/bin/activate && uvicorn main:app --host 0.0.0.0 --port 8000"

database:
  enabled: true
  engine: postgres
  framework: raw
  schema: db/schema.sql

cache:
  enabled: true

blobs:
  enabled: true

healthCheck:
  path: /health
